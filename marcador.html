<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#070f1e">
<title>Marcador en directo · Kortline</title>
<!--
  v3.0.0-dev.122 · B-PUBLIC1 · Marcador en directo para familias.
  Página de SOLO LECTURA: lee un único documento público
  (clubs/{club}/public/{token}) que publica la app del entrenador. No usa
  ninguna cuenta ni el código del club, no puede escribir nada y no muestra
  nombres de jugadoras (solo equipos, marcador, periodo y reloj).
-->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#070f1e;--s:#0d1a2e;--s2:#122236;--border:#1e3a5f;--tx:#f0f4ff;--td:#7a9cc8;--orange:#F06318;--win:#22c55e;--lose:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:"DM Sans",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px 24px}
.wrap{width:100%;max-width:520px}
.top{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--td);margin-bottom:14px}
.live{display:inline-flex;align-items:center;gap:6px;color:#ef4444}
.dot{width:9px;height:9px;border-radius:50%;background:#ef4444;animation:p 1.4s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
.card{background:var(--s);border:1px solid var(--border);border-radius:18px;padding:20px 16px;margin-bottom:14px}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.tn{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:clamp(18px,5.5vw,26px);line-height:1.05;word-break:break-word}
.side{font-size:11px;color:var(--td);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-top:4px}
.score{font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:clamp(64px,22vw,104px);line-height:1;font-variant-numeric:tabular-nums}
.sep{font-family:"Barlow Condensed",sans-serif;font-size:40px;color:var(--td)}
.meta{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.pill{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:8px 14px;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.pill.clock{font-family:"Barlow Condensed",sans-serif;font-size:24px;padding:4px 16px}
.periods{display:grid;gap:6px}
.prow{display:grid;grid-template-columns:1fr repeat(var(--n),minmax(34px,1fr));gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.prow div{text-align:center;padding:6px 0;border-radius:8px}
.prow .h{font-size:11px;color:var(--td);font-weight:800}
.prow .c{background:var(--s2);font-weight:800}
.prow .cur{outline:2px solid var(--orange)}
.lbl{text-align:left!important;font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg{text-align:center;color:var(--td);padding:40px 10px;line-height:1.6}
.res{display:inline-block;margin-top:12px;padding:6px 14px;border-radius:10px;font-weight:900;letter-spacing:1px}
.foot{text-align:center;font-size:11px;color:#3a5a80;margin-top:6px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg">Cargando marcador…</div></div>
<script>
(function(){
  var FIREBASE_CONFIG={apiKey:"AIzaSyBE8o8TdkI9j4cNtBk--Ro18f_mLN4Iz8s",authDomain:"kortline-v3.firebaseapp.com",projectId:"kortline-v3",storageBucket:"kortline-v3.firebasestorage.app",messagingSenderId:"1073570899301",appId:"1:1073570899301:web:b1af40b12563bce9016d8c"};
  var qs=new URLSearchParams(location.search);
  var club=(qs.get("c")||"").replace(/[^A-Za-z0-9_-]/g,"");
  var token=(qs.get("t")||"").replace(/[^A-Za-z0-9_-]/g,"");
  var app=document.getElementById("app");
  var data=null,ticker=null;
  function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function msg(t){app.innerHTML='<div class="msg">'+t+'</div>';}
  if(!club||!token){msg("Este enlace no es válido.<br>Pide al entrenador que te lo vuelva a enviar.");return;}
  if(typeof firebase==="undefined"){msg("No se ha podido cargar el marcador.<br>Comprueba tu conexión y vuelve a abrir el enlace.");return;}
  function clockNow(){
    if(!data||typeof data.clockSec!=="number")return null;
    var s=data.clockSec;
    if(data.clockRunning&&data.updatedAt)s=Math.max(0,s-Math.floor((Date.now()-data.updatedAt)/1000));
    return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  }
  function pname(i,n){return n===4?(i<4?"Q"+(i+1):"P"+(i-3)):(i<n?(i+1)+"ª":"P"+(i-n+1));}
  function render(){
    if(!data){msg("Este marcador ya no está disponible.<br>Puede que el entrenador haya dejado de compartirlo.");return;}
    var home=data.location!=="away";
    var left=home?{n:data.team,s:data.ours,side:"Local"}:{n:data.rival,s:data.theirs,side:"Local"};
    var right=home?{n:data.rival,s:data.theirs,side:"Visitante"}:{n:data.team,s:data.ours,side:"Visitante"};
    var per=data.periods||[],n=data.quarters||4;
    var status=data.finished?'<span>Final</span>':data.started?'<span class="live"><span class="dot"></span>En directo</span>':'<span>Aún no ha empezado</span>';
    var clk=clockNow();
    var res="";
    if(data.finished){var w=data.ours>data.theirs,l=data.ours<data.theirs;res='<div style="text-align:center"><span class="res" style="background:'+(w?"rgba(34,197,94,.15)":l?"rgba(239,68,68,.15)":"var(--s2)")+';color:'+(w?"var(--win)":l?"var(--lose)":"var(--tx)")+'">'+(w?"VICTORIA":l?"DERROTA":"EMPATE")+' de '+esc(data.team)+'</span></div>';}
    var cols=per.map(function(_,i){return '<div class="h">'+pname(i,n)+'</div>';}).join("");
    var rowO=per.map(function(p,i){return '<div class="c'+(!data.finished&&i===data.q-1?" cur":"")+'">'+(home?p.o:p.r)+'</div>';}).join("");
    var rowR=per.map(function(p,i){return '<div class="c'+(!data.finished&&i===data.q-1?" cur":"")+'">'+(home?p.r:p.o)+'</div>';}).join("");
    app.innerHTML='<div class="top">'+status+'<span style="margin-left:auto">'+esc(data.club||"")+'</span></div>'+
      '<div class="card"><div class="teams">'+
        '<div><div class="tn">'+esc(left.n)+'</div><div class="side">'+left.side+'</div></div>'+
        '<div style="display:flex;align-items:center;gap:8px"><div class="score">'+(left.s||0)+'</div><div class="sep">:</div><div class="score">'+(right.s||0)+'</div></div>'+
        '<div><div class="tn">'+esc(right.n)+'</div><div class="side">'+right.side+'</div></div></div>'+
        '<div class="meta">'+(data.started&&!data.finished?'<span class="pill">'+pname((data.q||1)-1,n)+'</span>':'')+(clk&&data.started&&!data.finished?'<span class="pill clock" id="clk">'+clk+'</span>':'')+'</div>'+res+'</div>'+
      (per.length?'<div class="card periods" style="--n:'+per.length+'"><div class="prow" style="--n:'+per.length+'"><div></div>'+cols+'</div>'+
        '<div class="prow" style="--n:'+per.length+'"><div class="lbl">'+esc(left.n)+'</div>'+rowO+'</div>'+
        '<div class="prow" style="--n:'+per.length+'"><div class="lbl">'+esc(right.n)+'</div>'+rowR+'</div></div>':'')+
      '<div class="foot">Se actualiza solo · Kortline</div>';
  }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    firebase.firestore().collection("clubs").doc(club).collection("public").doc(token).onSnapshot(function(snap){
      data=snap.exists?snap.data():null;render();
    },function(){msg("No se ha podido abrir este marcador.<br>Puede que el enlace haya caducado.");});
  }catch(e){msg("No se ha podido abrir este marcador.");}
  ticker=setInterval(function(){if(data&&data.clockRunning&&!data.finished){var c=document.getElementById("clk");var v=clockNow();if(c&&v)c.textContent=v;}},1000);
})();
</script>
</body>
</html>
