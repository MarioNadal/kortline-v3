name: Copiar producción → test

# Ejecuta scripts/copy-prod-to-test.js manualmente desde la pestaña Actions
# de GitHub (botón "Run workflow"), sin necesidad de tocar nada en un
# ordenador. Copia datos reales de producción (clubs/cbjaca) a la copia de
# pruebas (clubs/cbjaca-test): equipos, jugadores (cumpleaños, apodos...),
# partidos, eventos, catálogo de ejercicios y ejercicios en vivo. Solo
# lectura en producción -- en test solo crea/actualiza, nunca borra.
#
# v3.0.0-dev.78: la asistencia/planificación día a día (y las notas de
# entrenamiento) YA NO se copian -- se guardan con la fecha como id, así que
# un mismo día en producción y en test se pisaban entre sí (ver el
# comentario de incidente al principio de copy-prod-to-test.js). Esas dos
# colecciones se dejan siempre tal cual estén en cada club, nunca se tocan.
#
# El PIN del club se guarda como secreto del repositorio (Settings →
# Secrets and variables → Actions → New repository secret, nombre
# "CLUB_PIN") -- nunca se escribe aquí ni queda visible en ningún sitio.
# GitHub oculta automáticamente el valor de los secretos en los logs.

on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install

      - name: Copiar producción → test
        env:
          CLUB_PIN: ${{ secrets.CLUB_PIN }}
        run: node copy-prod-to-test.js
