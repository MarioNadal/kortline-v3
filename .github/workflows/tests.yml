name: Tests

# Corre la suite de regresion (tests/run-all.js sobre jsdom) en cada push y
# pull request a main. No hay build ni deploy aqui -- GitHub Pages sigue
# sirviendo main directamente, esto solo bloquea que un cambio con tests en
# rojo pase desapercibido antes de llegar a produccion.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tests/package-lock.json

      - name: Instalar dependencias (jsdom)
        run: npm ci

      - name: Correr suite de regresion
        # v3.0.0-dev.63 · B-CI1: valida test/index.html (lo realmente
        # desplegado y probado en /test/), no la raiz -- la raiz se queda
        # deliberadamente atras mientras una funcion nueva esta en pruebas y
        # aun no la ha aprobado Mario, asi que testearla aqui daria falsos
        # positivos en rojo por funciones que sencillamente aun no han
        # llegado a produccion. Ver harness.js para el detalle completo.
        run: KORTLINE_TEST_INDEX=test/index.html node run-all.js

      - name: Audit de dependencias
        run: npm audit --audit-level=high
