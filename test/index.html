<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070f1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pronósticos CBJ">
<title>Pronósticos CBJ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Tokens (idénticos a Kortline v3) ── */
:root{
  --navy:#0d2244;--navy2:#1a3a6b;--orange:#F06318;--orange2:#B83808;
  --orangeG:linear-gradient(135deg,#F06318,#B83808);
  --bg:#070f1e;--s:#0c1828;--s2:#111f34;--s3:#1a3050;--border:#1d3654;
  --tx:#eef2ff;--td:#7a9cc8;--tm:#3a5a80;
  --green:#22c55e;--red:#ef4444;--amber:#f59e0b;--gray:#6b7280;--sky:#38bdf8;
  --font-d:'Barlow Condensed',system-ui,sans-serif;--font-b:'DM Sans',system-ui,sans-serif;
  --r:12px;color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{background:var(--bg);}
body{font-family:var(--font-b);background:var(--bg);color:var(--tx);min-height:100vh;min-height:100dvh;background-image:radial-gradient(rgba(29,54,84,0.22) 1px,transparent 1px);background-size:24px 24px;overflow-x:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;}
input,select,textarea{-webkit-user-select:text;user-select:text;}
button{font-family:inherit;}
#root{max-width:430px;margin:0 auto;position:relative;overflow-x:hidden;}
/* ── Header ── */
.header{padding:13px 16px;background:rgba(6,12,24,0.92);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding-top:calc(14px + env(safe-area-inset-top));}
.hrow{display:flex;align-items:center;gap:10px;}
.htitle{font-family:var(--font-d);font-weight:900;font-size:24px;letter-spacing:.5px;line-height:1;text-transform:uppercase;}
.hsub{font-size:11px;color:var(--td);font-weight:700;letter-spacing:1.2px;text-transform:uppercase;margin-top:3px;}
.hlogo{width:36px;height:36px;border-radius:9px;flex-shrink:0;}
.bbtn{background:var(--s2);border:1px solid var(--border);color:var(--tx);min-width:36px;height:36px;border-radius:9px;cursor:pointer;font-size:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0 10px;font-weight:700;}
/* ── Nav ── */
.nav{display:flex;background:rgba(10,20,38,0.95);border-top:1px solid var(--border);position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:100;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding-bottom:env(safe-area-inset-bottom);}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;border:none;background:transparent;color:var(--tm);cursor:pointer;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
.nb.on{color:var(--orange);}
.nb span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px;}
.nb .ni{font-size:20px;line-height:1.2;}
.content{padding:14px 16px 90px;padding-bottom:calc(96px + env(safe-area-inset-bottom));}
/* ── Tipografía / cajas ── */
.sval{font-family:var(--font-d);font-weight:900;font-size:38px;color:var(--orange);line-height:1;}
.slbl{font-size:10px;color:var(--td);font-weight:700;text-transform:uppercase;letter-spacing:1.5px;margin-top:4px;}
.sbox{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:12px;}
.card{background:var(--s);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:10px;}
.sec{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--td);margin:18px 2px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.accent{height:4px;background:var(--orangeG);}
.muted{color:var(--td);}
.tiny{font-size:11px;color:var(--td);}
.d{font-family:var(--font-d);font-weight:900;}
.up{color:var(--green);}.down{color:var(--red);}
.mvp{background:linear-gradient(135deg,#fbbf24,#d97706);color:#1a1200;font-weight:900;font-size:10px;padding:2px 6px;border-radius:5px;letter-spacing:.5px;}
/* ── Botones / formularios (Kortline) ── */
.btn-p{width:100%;padding:13px;border:none;border-radius:9px;font-weight:800;font-size:15px;cursor:pointer;background:var(--orangeG);color:white;margin-top:4px;transition:opacity .15s;}
.btn-p:disabled{opacity:.4;cursor:not-allowed;}
.btn-s{width:100%;padding:13px;border:1px solid var(--border);border-radius:9px;font-weight:700;font-size:15px;cursor:pointer;background:var(--s2);color:var(--td);margin-top:8px;}
.btn-d{width:100%;padding:13px;border:1px solid rgba(239,68,68,.4);border-radius:9px;font-weight:700;font-size:15px;cursor:pointer;background:rgba(239,68,68,.1);color:var(--red);margin-top:8px;}
.btn-sm{padding:7px 12px;border-radius:8px;font-size:12px;font-weight:800;border:none;cursor:pointer;background:var(--orangeG);color:#fff;white-space:nowrap;}
.btn-sm.ghost{background:var(--s2);border:1px solid var(--border);color:var(--td);}
.btn-sm:disabled{opacity:.35;cursor:not-allowed;}
.fg{margin-bottom:13px;}
.fl{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--td);margin-bottom:5px;display:block;}
.fi{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:11px 12px;color:var(--tx);font-size:16px;outline:none;font-family:var(--font-b);min-height:44px;}
.fi:focus{border-color:var(--orange);}
.fi option{background:#0c1828;}
.frow{display:flex;gap:10px;}.frow>.fg{flex:1;min-width:0;}
.pnum{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:900;font-size:16px;flex-shrink:0;color:white;}
/* ── Chips / segmentado ── */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{padding:7px 12px;border-radius:20px;border:1px solid var(--border);background:var(--s2);color:var(--td);font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;}
.chip.on{background:rgba(240,99,24,.15);border-color:var(--orange);color:var(--orange);}
.seg{display:flex;background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:3px;}
.seg button{flex:1;border:none;background:transparent;color:var(--td);font-weight:800;font-size:13px;padding:9px 6px;border-radius:8px;cursor:pointer;}
.seg button.on{background:var(--orangeG);color:#fff;}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:800;white-space:nowrap;}
.pill.g{background:rgba(34,197,94,.14);color:var(--green);}
.pill.a{background:rgba(245,158,11,.14);color:var(--amber);}
.pill.o{background:rgba(240,99,24,.15);color:var(--orange);}
.pill.n{background:var(--s3);color:var(--td);}
.tag{font-size:10px;font-weight:800;letter-spacing:.8px;padding:2px 6px;border-radius:5px;}
/* ── Filas ── */
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;}
.row:last-child{border-bottom:none;}
.row:active{background:var(--s2);}
.row.me{background:rgba(240,99,24,.08);box-shadow:inset 3px 0 0 var(--orange);}
.rmain{flex:1;min-width:0;}
.rname{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rsub{font-size:11px;color:var(--td);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.rsub.one{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rsub.fx{flex-wrap:nowrap;white-space:nowrap;gap:4px;}
.rsub.fx .riv{min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--tx);}
.rsub.fx .when{flex-shrink:0;}
.rnum{text-align:right;flex-shrink:0;}
.rnum .v{font-family:var(--font-d);font-weight:900;font-size:19px;line-height:1;}
.rnum .l{font-size:10px;color:var(--td);font-weight:700;margin-top:2px;}
.rank{width:26px;text-align:center;font-family:var(--font-d);font-weight:900;font-size:18px;color:var(--td);flex-shrink:0;}
.rank.r1{color:#fbbf24;}.rank.r2{color:#cbd5e1;}.rank.r3{color:#d97706;}
/* ── Hero ── */
.hero{padding:16px;}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.hero-name{font-family:var(--font-d);font-weight:900;font-size:26px;line-height:1.05;text-transform:uppercase;letter-spacing:.3px;}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px;}
.kv .k{font-size:10px;color:var(--td);font-weight:700;text-transform:uppercase;letter-spacing:1.2px;}
.kv .v{font-family:var(--font-d);font-weight:800;font-size:21px;margin-top:3px;}
.banner{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:10px;border:1px solid;}
.banner.g{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.3);color:#bbf7d0;}
.banner.a{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.3);color:#fde68a;}
.banner.o{background:rgba(240,99,24,.08);border-color:rgba(240,99,24,.3);color:#fed7aa;}
.dl{border-radius:14px;padding:14px 16px;margin-bottom:12px;border:1px solid rgba(34,197,94,.35);background:linear-gradient(135deg,rgba(34,197,94,.14),rgba(34,197,94,.04));}
.dl.warn{border-color:rgba(245,158,11,.45);background:linear-gradient(135deg,rgba(245,158,11,.18),rgba(245,158,11,.04));}
.dl.hot{border-color:rgba(239,68,68,.55);background:linear-gradient(135deg,rgba(239,68,68,.2),rgba(239,68,68,.05));}
.dl.shut{border-color:var(--border);background:var(--s);}
.dl-k{font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--td);}
.dl-c{font-family:'Bebas Neue',Impact,sans-serif;font-size:34px;line-height:1.05;margin-top:2px;color:var(--tx);font-variant-numeric:tabular-nums;}
.dl.warn .dl-c{color:var(--amber,#f59e0b);} .dl.hot .dl-c{color:var(--red);}
.dl-w{font-size:13px;color:var(--td);margin-top:2px;}
.dl-me{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:13px;font-weight:700;}
.dl-bar{flex:1;height:6px;border-radius:9px;background:var(--s3);overflow:hidden;} .dl-bar span{display:block;height:100%;background:var(--orange);border-radius:9px;}
.dl-bar.ok span{background:var(--green);}
.prog{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);font-size:13px;} .prog:last-child{border-bottom:none;}
.prog b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.banner b{color:var(--tx);}
/* ── Barras ── */
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;padding:6px 2px 0;}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;}
.bar .b{width:100%;max-width:30px;border-radius:5px 5px 2px 2px;background:var(--orangeG);min-height:3px;}
.bar .b.neg{background:var(--red);}
.bar .b.nj{background:var(--s3);}
.bar .bv{font-size:10px;font-weight:800;margin-bottom:3px;font-family:var(--font-d);}
.bar .bl{font-size:9.5px;color:var(--td);margin-top:4px;font-weight:700;}
/* ── Modales (Kortline) ── */
.ov{position:fixed;inset:0;background:rgba(3,8,18,.72);z-index:9999;animation:fade .2s ease;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--s);border-radius:20px 20px 0 0;border-top:1px solid var(--border);position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;z-index:10000;animation:up .28s ease;overscroll-behavior:none;}
@keyframes up{from{transform:translateX(-50%) translateY(100%)}to{transform:translateX(-50%) translateY(0)}}
.mhandle{width:34px;height:4px;background:var(--s3);border-radius:2px;margin:-6px auto 14px;}
.mtitle{font-family:var(--font-d);font-weight:900;font-size:22px;margin-bottom:4px;letter-spacing:.5px;}
.msub{font-size:13px;color:var(--td);margin-bottom:14px;line-height:1.5;}
.ov.top{z-index:99998}.modal.top{z-index:99999}
/* ── Toast ── */
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--s3);border:1px solid var(--border);color:var(--tx);padding:11px 16px;border-radius:10px;font-weight:700;font-size:13px;z-index:100000;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90vw;animation:fade .2s;}
.toast.err{border-color:rgba(239,68,68,.5);}
/* ── Login ── */
.auth{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:28px 20px calc(28px + env(safe-area-inset-bottom));}
.auth-logo{width:78px;height:78px;border-radius:20px;margin:0 auto 14px;display:block;box-shadow:0 10px 36px rgba(240,99,24,.35);}
.auth-t{font-family:var(--font-d);font-weight:900;font-size:38px;text-align:center;line-height:1;letter-spacing:.5px;}
.auth-t span{color:var(--orange);}
.auth-s{text-align:center;color:var(--td);font-size:13px;margin:8px 0 22px;}
.pin{letter-spacing:10px;font-family:var(--font-d);font-weight:800;font-size:22px;text-align:center;}
.demo{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.3);color:#bae6fd;border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.5;margin-bottom:14px;}
/* ── Admin ── */
.arow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);}
.arow:last-child{border-bottom:none;}
.vin{width:74px;text-align:center;font-family:var(--font-d);font-weight:800;font-size:18px;padding:8px 6px;min-height:40px;}
.tgl{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;}
.tgl .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.tgl.on .box{background:var(--orangeG);border-color:var(--orange);color:#fff;}
.empty{padding:26px 16px;text-align:center;color:var(--td);font-size:13px;line-height:1.6;}
.center{text-align:center;}
.mt8{margin-top:8px}.mt12{margin-top:12px}
/* ── v0.2: equipos y porra ── */
.tbadge{border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;color:#fff;line-height:1;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);}
.tbadge .tb1{font-family:var(--font-d);font-weight:900;letter-spacing:.5px;}
.tbadge .tb2{font-family:var(--font-d);font-weight:800;opacity:.85;margin-top:1px;}
.tbadge.empty-b{width:40px;height:40px;background:transparent;border:1.5px dashed var(--border);color:var(--orange);font-size:20px;box-shadow:none;}
.row.cap{background:rgba(251,191,36,.06);box-shadow:inset 3px 0 0 #fbbf24;}
.capb{display:inline-block;background:linear-gradient(135deg,#fbbf24,#d97706);color:#1a1200;font-weight:900;font-size:9.5px;padding:2px 6px;border-radius:5px;letter-spacing:.5px;vertical-align:2px;margin-left:4px;}
.lnk{color:var(--orange);font-weight:800;text-decoration:underline;cursor:pointer;}
.pcard{background:var(--s);border:1px solid var(--border);border-radius:var(--r);padding:12px;margin-bottom:10px;}
.prow{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.picks.three{grid-template-columns:repeat(3,1fr);margin-top:6px;}
.picks.four{grid-template-columns:repeat(4,1fr);margin-top:6px;}
.picks.four .pick{font-size:12px;padding:10px 2px;}
.picks.dim{opacity:.4;}
.pick{border:1px solid var(--border);background:var(--s2);color:var(--td);font-weight:800;font-size:13px;padding:10px 6px;border-radius:9px;cursor:pointer;min-height:42px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pick:disabled{cursor:default;}
.pick.on{background:rgba(240,99,24,.16);border-color:var(--orange);color:var(--orange);}
.pick.w.on{background:rgba(34,197,94,.14);border-color:var(--green);color:var(--green);}
.pick.l.on{background:rgba(239,68,68,.12);border-color:var(--red);color:var(--red);}
.pick:focus-visible,.chip:focus-visible,.btn-p:focus-visible,.btn-s:focus-visible,.nb:focus-visible{outline:2px solid var(--orange);outline-offset:2px;}
.fxrow{padding:10px 14px;border-bottom:1px solid var(--border);}
.fxrow:last-child{border-bottom:none;}
.rules{font-size:14px;color:var(--tx);line-height:1.65;}
.stars{color:#fbbf24;letter-spacing:1px;white-space:nowrap;}.stars .off{color:var(--s3);}
/* ── v0.3: pronósticos ── */
.pcard.own{border-style:dashed;background:rgba(240,99,24,.05);}
.owntxt{font-size:14px;color:var(--td);padding:4px 2px 2px;}
.owntxt b{color:var(--orange);}
.plbl{font-size:10px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--td);margin:12px 2px 6px;display:flex;justify-content:space-between;}
.plbl span{color:var(--orange);letter-spacing:.5px;text-transform:none;}
.plbl.dim{opacity:.4;}
.prow{margin-bottom:2px;}
.score{display:flex;align-items:flex-end;justify-content:center;gap:12px;}
.sc{display:flex;flex-direction:column;align-items:center;gap:4px;}
.sc .vin{width:86px;font-size:22px;}
.agg{margin-top:12px;}
.aggbar{height:6px;border-radius:3px;background:rgba(239,68,68,.35);overflow:hidden;margin-bottom:5px;}
.aggbar span{display:block;height:100%;background:var(--green);border-radius:3px;}
.tbadge.fam{background:var(--s3);font-size:15px;}
.podium .pod{display:flex;align-items:flex-end;justify-content:center;gap:8px;}
.pstep{flex:1;max-width:120px;text-align:center;display:flex;flex-direction:column;align-items:center;}
.pmedal{font-size:26px;line-height:1;}
.pname{font-weight:800;font-size:13px;margin-top:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ppts{font-family:var(--font-d);font-weight:900;font-size:18px;color:var(--orange);}
.pblock{width:100%;border-radius:8px 8px 0 0;margin-top:6px;background:linear-gradient(180deg,var(--s3),var(--s2));border:1px solid var(--border);border-bottom:none;}
.pstep.p1 .pblock{height:56px;background:linear-gradient(180deg,rgba(251,191,36,.35),var(--s2));}
.pstep.p2 .pblock{height:38px;}
.pstep.p3 .pblock{height:26px;}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.bdg{position:relative;background:var(--s);border:1px solid var(--border);border-radius:var(--r);padding:12px 6px 10px;text-align:center;cursor:pointer;color:var(--tm);}
.bdg .bic{font-size:28px;line-height:1.1;filter:grayscale(1);opacity:.35;}
.bdg .bt{font-size:11.5px;font-weight:800;margin-top:5px;}
.bdg.on{border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.06);color:var(--tx);}
.bdg.on .bic{filter:none;opacity:1;}
.bdg .bn{position:absolute;top:6px;right:7px;font-family:var(--font-d);font-weight:900;font-size:13px;color:#fbbf24;}
</style>
</head>
<body>
<div id="root"></div>
<div id="mroot"></div>

<!-- Firebase (solo se usa si FIREBASE_CONFIG está relleno) -->

const $ = id => document.getElementById(id);
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const tramoOf = d => { const a=Math.abs(d); return a<=5?1:a<=10?2:a<=15?3:4; };
const pct = x => Math.round(x*100)+"%";

function newUserDoc(nick,teamId){ return {name:nick.trim(),teamId:teamId||null,total:0,byJ:{},parentOk:true,createdAt:Date.now()}; }
function makeLocalDB(){
  const KEY="pcbj:demo:v34";
  let store=null; try{store=JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){}
  const fresh=!store;
  if(!store) store={teams:{},managers:{},jornadas:{},config:{},preds:{},predsLocked:{},users:{}};
  let uid=null; try{uid=localStorage.getItem(KEY+":uid")||null;}catch(e){}
  const L={}, LD={}; let authCb=null;
  const persist=()=>{ try{localStorage.setItem(KEY,JSON.stringify(store)); localStorage.setItem(KEY+":uid",uid||"");}catch(e){} };
  const list=col=>Object.entries(store[col]||{}).map(([id,d])=>Object.assign(clone(d),{id}));
  const emit=col=>{ (L[col]||[]).forEach(cb=>cb(list(col))); Object.entries(LD).forEach(([k,cbs])=>{ const [c,id]=k.split("/"); if(c===col) cbs.forEach(cb=>cb(store[c][id]?clone(store[c][id]):null)); }); };
  const api={
    demo:true, fresh,
    listen(col,cb){ (L[col]=L[col]||[]).push(cb); cb(list(col)); return ()=>{L[col]=L[col].filter(x=>x!==cb);}; },
    listenDoc(col,id,cb){ const k=col+"/"+id; (LD[k]=LD[k]||[]).push(cb); cb(store[col]&&store[col][id]?clone(store[col][id]):null); return ()=>{LD[k]=LD[k].filter(x=>x!==cb);}; },
    async getAll(col){ return list(col); },
    async getDoc(col,id){ return store[col]&&store[col][id]?clone(store[col][id]):null; },
    async batch(ops){
      ops.forEach(o=>{ store[o.col]=store[o.col]||{};
        if(o.op==="del") delete store[o.col][o.id];
        else store[o.col][o.id]= (o.merge||o.fields) ? Object.assign(store[o.col][o.id]||{},clone(o.data)) : clone(o.data); });
      persist(); [...new Set(ops.map(o=>o.col))].forEach(emit);
    },
    newId:()=> "t"+Math.random().toString(36).slice(2,10),
    reset(){ try{localStorage.removeItem(KEY);localStorage.removeItem(KEY+":uid");}catch(e){} location.reload(); },
    auth:{
      onChange(cb){ authCb=cb; cb(uid&&store.managers[uid]?{uid,admin:true}:null); },
      async register({nick,pin,code,teamId}){
        if(String(code).trim().toUpperCase()!=="DEMO") throw new Error("Código del club incorrecto (en la demo es DEMO)");
        const k=slug(nick); if(!k) throw new Error("Escribe un apodo");
        if(store.users[k]) throw new Error("Ese apodo ya está cogido. Si es vuestro, entrad con el PIN.");
        const id="u"+Math.random().toString(36).slice(2,10);
        store.users[k]={uid:id,pin}; store.managers[id]=newUserDoc(nick,teamId); store.preds[id]={};
        uid=id; persist(); emit("managers"); authCb&&authCb({uid,admin:true});
      },
      async login({nick,pin}){
        const u=store.users[slug(nick)];
        if(!u||u.pin!==pin) throw new Error("Apodo o PIN incorrectos");
        uid=u.uid; persist(); authCb&&authCb({uid,admin:true});
      },
      async logout(){ uid=null; persist(); authCb&&authCb(null); }
    }
  };
  return api;
}
function makeFirebaseDB(){
  firebase.initializeApp(FIREBASE_CONFIG);
  const fs=firebase.firestore(), au=firebase.auth();
  const email=nick=>slug(nick)+"@supermanager-cbj.app";
  const pw=pin=>"cbjsm-"+pin;
  const onErr=col=>e=>{console.warn(col,e); toast("Error de conexión ("+col+")",true);};
  return {
    demo:false,
    listen(col,cb){
      if(col==="config") return fs.collection("config").doc("game").onSnapshot(d=>cb(d.exists?[Object.assign(d.data(),{id:"game"})]:[]),onErr(col));
      return fs.collection(col).onSnapshot(s=>cb(s.docs.map(d=>Object.assign(d.data(),{id:d.id}))),onErr(col));
    },
    listenDoc(col,id,cb,errCb){ return fs.collection(col).doc(id).onSnapshot(d=>cb(d.exists?d.data():null),e=>{ console.warn(col,e); errCb?errCb(e):onErr(col)(e); }); },
    async getAll(col){ const s=await fs.collection(col).get(); return s.docs.map(d=>Object.assign(d.data(),{id:d.id})); },
    async getDoc(col,id){ const d=await fs.collection(col).doc(id).get(); return d.exists?d.data():null; },
    async batch(ops){
      for(let i=0;i<ops.length;i+=450){
        const b=fs.batch();
        ops.slice(i,i+450).forEach(o=>{ const r=fs.collection(o.col).doc(o.id);
          if(o.op==="del") b.delete(r); else b.set(r,o.data,o.fields?{mergeFields:o.fields.map(f=>new firebase.firestore.FieldPath(String(f)))}:o.merge?{merge:true}:{}); });
        await b.commit();
      }
    },
    newId:()=>fs.collection("teams").doc().id,
    setClubCode:code=>fs.collection("secret").doc("club").set({code:String(code).trim().toUpperCase()}),
    auth:{
      onChange(cb){ au.onAuthStateChanged(async u=>{ if(!u) return cb(null);
        let admin=false; try{ admin=(await fs.collection("admins").doc(u.uid).get()).exists; }catch(e){}
        cb({uid:u.uid,admin}); }); },
      async register({nick,pin,code,teamId}){
        if(!slug(nick)) throw new Error("Escribe un apodo");
        let cred;
        try{ cred=await au.createUserWithEmailAndPassword(email(nick),pw(pin)); }
        catch(e){ throw new Error(e.code==="auth/email-already-in-use"?"Ese apodo ya está cogido. Si es vuestro, entrad con el PIN.":"No se pudo crear la cuenta ("+(e.code||e.message)+")"); }
        const uid=cred.user.uid;
        try{ await fs.collection("joins").doc(uid).set({code:String(code).trim().toUpperCase(),at:Date.now()}); }
        catch(e){ await cred.user.delete().catch(()=>{}); throw new Error("Código del club incorrecto"); }
        await fs.collection("managers").doc(uid).set(newUserDoc(nick,teamId));
        await fs.collection("preds").doc(uid).set({});
      },
      async login({nick,pin}){
        try{ await au.signInWithEmailAndPassword(email(nick),pw(pin)); }
        catch(e){ throw new Error("Apodo o PIN incorrectos"); }
      },
      logout:()=>au.signOut()
    }
  };
}
const DB = DEMO ? makeLocalDB() : makeFirebaseDB();

const S = {
  ready:{config:false,teams:false,managers:false,jornadas:false,preds:false},
  cfg:clone(DEFAULT_CFG), teams:{}, managers:{}, jornadas:{}, myPreds:{},
  user:null, tab:"jornada", authTab:"login",
  cls:{mode:"general",j:null},
  adm:{sec:"jornada",draft:null,fx:null}

const me = () => S.user && S.managers[S.user.uid];
const isAdmin = () => !!(S.user && S.user.admin);
const jOpen = () => (S.cfg.jornada||0)+1;
const curJ = () => S.jornadas[String(jOpen())] || null;
// Cierre automático: el primer partido de la jornada (viernes o sábado, el que sea antes).
const deadlineOf = jd => { const ts=Object.values((jd&&jd.fixtures)||{}).map(f=>f&&f.at).filter(x=>typeof x==="number"&&x>0); return ts.length?Math.min(...ts):null; };
const curDeadline = () => deadlineOf(curJ());
const pastDeadline = () => { const d=curDeadline(); return !!d && Date.now()>=d; };
const isOpen = () => S.cfg.estado==="open" && !pastDeadline();
const published = () => Object.values(S.jornadas).filter(j=>j.status==="published").sort((a,b)=>a.n-b.n);
const lastPub = () => { const p=published(); return p[p.length-1]||null; };
const activeTeams = () => Object.values(S.teams).filter(t=>t.active!==false).sort(teamSort);
function teamSort(a,b){ return CAT_ORDER.indexOf(a.cat)-CAT_ORDER.indexOf(b.cat) || a.gender.localeCompare(b.gender) || a.name.localeCompare(b.name); }
const catOfUser = m => m&&m.teamId&&S.teams[m.teamId] ? S.teams[m.teamId].cat : null;

let unsubs=[];
function stopListeners(){ unsubs.forEach(u=>u&&u()); unsubs=[]; Object.keys(S.ready).forEach(k=>S.ready[k]=false); }
function startListeners(){
  stopListeners();
  const map=arr=>Object.fromEntries(arr.map(d=>[d.id,d]));
  unsubs.push(DB.listen("config",arr=>{ const g=arr.find(d=>d.id==="game"); S.cfg=Object.assign(clone(DEFAULT_CFG),g||{}); S.cfg.pts={ganador:((g||{}).pts||{}).ganador??DEFAULT_CFG.pts.ganador, tramo:((g||{}).pts||{}).tramo??DEFAULT_CFG.pts.tramo}; S.ready.config=true; render(); }));
  unsubs.push(DB.listen("teams",arr=>{ S.teams=map(arr); S.ready.teams=true; render(); }));
  unsubs.push(DB.listen("managers",arr=>{ S.managers=map(arr); S.ready.managers=true; render(); }));
  unsubs.push(DB.listen("jornadas",arr=>{ S.jornadas=map(arr); S.ready.jornadas=true; render(); }));
}
// Si config/game no existe o viene de una versión anterior (sin "estado"), el admin lo crea al entrar.
async function ensureConfig(){
  try{
    const g=await DB.getDoc("config","game");
    if(g&&typeof g.estado==="string"&&g.pts&&g.ptsV===DEFAULT_CFG.ptsV) return;
    const data={season:(g&&g.season)||DEFAULT_CFG.season, jornada:typeof (g&&g.jornada)==="number"?g.jornada:0, estado:(g&&g.estado)||"open", pts:clone(DEFAULT_CFG.pts), ptsV:DEFAULT_CFG.ptsV};
    await DB.batch([{op:"set",col:"config",id:"game",data,fields:["season","jornada","estado","pts","ptsV"]}]);
    toast("⚙️ Configuración del juego actualizada");
  }catch(e){ console.warn("ensureConfig",e); }
}
let predUnsub=null;
function watchMyPreds(){
  predUnsub&&predUnsub(); S.ready.preds=false;
  if(!S.user){ S.myPreds={}; return; }
  const uid=S.user.uid; let created=false;
  predUnsub=DB.listenDoc("preds",uid,d=>{
    // cuentas creadas con versiones anteriores no tienen documento de pronósticos: se crea vacío
    if(!d&&!created){ created=true; DB.batch([{op:"set",col:"preds",id:uid,data:{}}]).catch(()=>{}); }
    S.myPreds=d||{}; S.ready.preds=true; render();
  }, e=>{
    S.myPreds={}; S.ready.preds=true; render();
    toast(e&&e.code==="permission-denied"?"Sin permiso para leer pronósticos: publica las reglas nuevas de Firestore":"Error de conexión (pronósticos)",true);
  });
}

/* ════════════════════════════════════════════════════════════════
   LÓGICA DEL JUEGO

// Valora un pronóstico contra el resultado real. Devuelve puntos y qué se acertó.
function scorePred(pr,res){
  const out={pts:0,g:false,t:false};
  if(!pr||!res||typeof res.us!=="number") return out;
  const d=res.us-res.them; const P=S.cfg.pts;
  if(d!==0&&pr.w===(d>0?"W":"L")){ out.g=true; out.pts+=P.ganador; if(pr.t===tramoOf(d)){ out.t=true; out.pts+=P.tramo; } }
  return out;
}
function myPred(J,tid){ return ((S.myPreds||{})[String(J)]||{})[tid]||null; }
async function savePred(tid,patch){
  if(!isOpen()){ render(); return toast("Los pronósticos ya están cerrados",true); }
  if(me().teamId===tid) return;
  const J=String(jOpen()); const all=clone(S.myPreds||{}); all[J]=all[J]||{};
  const p=Object.assign({},all[J][tid]||{},patch);
  Object.keys(p).forEach(k=>{ if(p[k]===null||p[k]===undefined||p[k]==="") delete p[k]; });
  if(!p.w){ delete p.t; }
  if(Object.keys(p).length) all[J][tid]=p; else delete all[J][tid];
  const prev=S.myPreds; S.myPreds=all; render(); // respuesta inmediata en pantalla
  try{ await DB.batch([{op:"set",col:"preds",id:S.user.uid,data:{[J]:all[J]},fields:[J]}]); }
  catch(e){ console.warn("preds",e); S.myPreds=prev; render();
    toast(e&&e.code==="permission-denied"?"No se pudo guardar: el club aún no ha abierto los pronósticos (falta config/game en Firestore)":"No se pudo guardar el pronóstico. Revisa la conexión",true); }
}
function pickW(tid,w){ const p=myPred(jOpen(),tid)||{}; savePred(tid, p.w===w ? {w:null,t:null} : {w}); }
function pickT(tid,t){ const p=myPred(jOpen(),tid)||{}; if(!p.w) return toast("Primero elige quién gana",true); savePred(tid,{t:p.t===t?null:t}); }

/* ── Admin: ciclo de jornada ── */
async function closeOps(){
  const J=jOpen(); const jd=S.jornadas[String(J)]||{}; const fx=jd.fixtures||{};
  const all=await DB.getAll("preds"); const locked={}; const agg={};
  Object.keys(fx).forEach(tid=>agg[tid]={n:0,w:0});
  all.forEach(doc=>{ const uid=doc.id; const pj=doc[String(J)]; if(!pj||!S.managers[uid]) return;
    const clean={}; Object.entries(pj).forEach(([tid,pr])=>{ if(!fx[tid]||!pr.w||S.managers[uid].teamId===tid) return; clean[tid]={w:pr.w,t:pr.t||null}; agg[tid].n++; if(pr.w==="W") agg[tid].w++; });
    if(Object.keys(clean).length) locked[uid]=clean; });
  return [
    {op:"set",col:"predsLocked",id:String(J),data:locked},
    {op:"set",col:"jornadas",id:String(J),data:{n:J,status:"closed",fixtures:fx,results:jd.results||{},agg,picks:locked,players:Object.keys(locked).length,closedAt:Date.now()},fields:["n","status","fixtures","results","agg","picks","players","closedAt"]},
    {op:"set",col:"config",id:"game",data:{estado:"closed"},merge:true}
  ];
}
async function publishOps(J,results){
  const jd=Object.assign({},S.jornadas[String(J)]||{}); delete jd.id;
  const locked=(await DB.getDoc("predsLocked",String(J)))||{};
  // Lobo solitario: por partido, quién acierta el ganador. Si de 2+ pronósticos solo acierta uno, sus puntos de ese partido x2.
  const hits={}, cnt={};
  Object.entries(locked).forEach(([uid,pj])=>Object.entries(pj).forEach(([tid,pr])=>{ const r=results[tid]; if(!r) return;
    cnt[tid]=(cnt[tid]||0)+1; if(scorePred(pr,r).g) (hits[tid]=hits[tid]||[]).push(uid); }));
  const loneOf=tid=>(cnt[tid]>=2&&(hits[tid]||[]).length===1)?hits[tid][0]:null;
  const mPts={};
  Object.entries(locked).forEach(([uid,pj])=>{
    const s={p:0,n:0,g:0,t:0,solo:0};
    Object.entries(pj).forEach(([tid,pr])=>{ const r=results[tid]; if(!r) return; const o=scorePred(pr,r); let pts=o.pts;
      if(loneOf(tid)===uid){ pts*=SOLO_MULT; s.solo++; }
      s.n++; s.p+=pts; if(o.g)s.g++; if(o.t)s.t++; });
    mPts[uid]=s;
  });
  const order=Object.entries(mPts).sort((a,b)=>b[1].p-a[1].p);
  const podium=order.filter(([,s])=>s.p>0).slice(0,3).map(([u])=>u);
  const ops=[];
  Object.values(S.teams).forEach(t=>{ const r=results[t.id]; if(!r) return;
    const d=Object.assign({},t); delete d.id; d.res=Object.assign({},t.res||{}); d.res[J]={us:r.us,them:r.them,rival:(jd.fixtures||{})[t.id]?.rival||""};
    ops.push({op:"set",col:"teams",id:t.id,data:d}); });
  Object.entries(mPts).forEach(([uid,s])=>{ const m=S.managers[uid]; if(!m) return;
    const byJ=Object.assign({},m.byJ||{}); byJ[J]=s.p;
    ops.push({op:"set",col:"managers",id:uid,data:{byJ,total:Object.values(byJ).reduce((a,v)=>a+v,0)},merge:true}); });
  ops.push({op:"set",col:"jornadas",id:String(J),data:Object.assign(jd,{n:J,status:"published",results,mPts,podium,picks:locked,solo:Object.fromEntries(Object.keys(results).map(t=>[t,loneOf(t)]).filter(([,u])=>u)),publishedAt:Date.now()})});
  ops.push({op:"set",col:"config",id:"game",data:{jornada:J,estado:"open",deadline:0},merge:true});
  return ops;
}
function undoOps(){
  const J=S.cfg.jornada, jd=S.jornadas[String(J)];
  if(!jd||jd.status!=="published") return null;
  const ops=[];
  Object.values(S.teams).forEach(t=>{ if(!t.res||!t.res[J]) return; const d=Object.assign({},t); delete d.id; d.res=Object.assign({},t.res); delete d.res[J]; ops.push({op:"set",col:"teams",id:t.id,data:d}); });
  Object.entries(S.managers).forEach(([uid,m])=>{ if(!m.byJ||m.byJ[J]==null) return; const d=Object.assign({},m); delete d.id; d.byJ=Object.assign({},m.byJ); delete d.byJ[J]; d.total=Object.values(d.byJ).reduce((a,v)=>a+v,0); ops.push({op:"set",col:"managers",id:uid,data:d}); });
  const nj=Object.assign({},jd,{status:"closed"}); delete nj.id; delete nj.mPts; delete nj.podium; delete nj.publishedAt; delete nj.solo;
  ops.push({op:"set",col:"jornadas",id:String(J),data:nj});
  ops.push({op:"set",col:"config",id:"game",data:{jornada:J-1,estado:"closed"},merge:true});
  return ops;
}

/* ── Clasificaciones e insignias ── */
function ranking(opts){
  opts=opts||{}; const j=opts.j;
  let arr=Object.entries(S.managers).map(([uid,m])=>({uid,m,pts: j ? (m.byJ||{})[j] : (m.total||0)}));
  if(j) arr=arr.filter(x=>typeof x.pts==="number");
  if(opts.cat) arr=arr.filter(x=>catOfUser(x.m)===opts.cat);
  arr.sort((a,b)=>(b.pts||0)-(a.pts||0)||a.m.name.localeCompare(b.m.name));
  let lp=null,lr=0; arr.forEach((x,i)=>{ if(x.pts!==lp){lr=i+1;lp=x.pts;} x.rank=lr; });
  return arr;
}
function badgesOf(uid){
  const pub=published(); const res={pleno:0,triple:0,racha:0,fiel:0,podio:0,ojo:0};
  let run=0, best=0, jugadas=0, tramos=0;
  pub.forEach(j=>{ const s=(j.mPts||{})[uid];
    if(s&&s.n){ jugadas++; tramos+=s.t||0; if(s.n>=3&&s.g===s.n) res.pleno++; if((s.t||0)>=3) res.triple++;
      if(s.g/s.n>=0.5){ run++; best=Math.max(best,run); } else run=0; }
    else run=0;
    if((j.podium||[]).includes(uid)) res.podio++; });
  res.racha=Math.floor(best/3); res.fiel=Math.floor(jugadas/5); res.ojo=Math.floor(tramos/10);
  return {res,run,jugadas,tramos};
}

let progT=0;
async function loadProgress(force){
  if(!S.user||!S.user.admin||!isOpen()) return; if(!force&&Date.now()-progT<45000) return; progT=Date.now();

// Nombre corto del rival para botones: quita "Club Baloncesto", "CB", "C.B.", "Basket"… y se queda con lo que identifica.
function rivalShort(n){
  const s=String(n||"").replace(/(^|\s)(club\s+(de\s+)?baloncesto|club\s+basket|baloncesto|basket(ball)?|c\.?\s?b\.?|b\.?\s?c\.?|club|s\.?d\.?|c\.?d\.?|a\.?d\.?)(?=\s|$)/gi," ").replace(/\s{2,}/g," ").trim();
  return s||String(n||"").trim()||"el rival";
}
// Lo que ha dicho cada uno en un partido (solo se enseña con la jornada cerrada).
function picksLine(j,tid,res){
  const pk=j&&j.picks; if(!pk) return "";
  const parts=Object.entries(pk).filter(([u,pj])=>u!==S.user.uid&&pj[tid]&&S.managers[u]).map(([u,pj])=>{ const pr=pj[tid];
    const txt=(pr.w==="W"?"CBJ":rivalShort(j.fixtures?.[tid]?.rival))+(pr.t?" "+TRAMOS[pr.t]:"");
    let pts=""; if(res){ let o=scorePred(pr,res).pts; const lone=j.solo&&j.solo[tid]===u; if(lone)o*=SOLO_MULT; pts=` <b style="color:var(${o?"--green":"--td"})">${o?"+"+o:"0"}${lone?" 🐺":""}</b>`; }
    return `<span style="white-space:nowrap">${esc(S.managers[u].name)}: ${esc(txt)}${pts}</span>`; });
  return parts.length?`<div class="tiny" style="margin-top:4px;line-height:1.5;display:flex;flex-wrap:wrap;gap:2px 12px">${parts.join("")}</div>`:"";
}
const DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const hhmm = d => String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
const fxWhen = ms => { const d=new Date(ms); return DIAS[d.getDay()].slice(0,3).replace(/^./,c=>c.toUpperCase())+" "+hhmm(d); };
const longWhen = ms => { const d=new Date(ms); return DIAS[d.getDay()].replace(/^./,c=>c.toUpperCase())+" "+d.getDate()+" "+MESES[d.getMonth()]+" · "+hhmm(d); };
const toLocalInput = ms => { if(!ms) return ""; const d=new Date(ms); const z=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`; };
function countdown(ms){ let t=Math.max(0,Math.floor(ms/60000)); const d=Math.floor(t/1440); t%=1440; const h=Math.floor(t/60), m=t%60;
  return d?`${d}d ${h}h ${String(m).padStart(2,"0")}m`:h?`${h}h ${String(m).padStart(2,"0")}m`:`${m} min`; }
function fxText(f){ return `<span>${f.home===false?"@":"vs"}</span><b class="riv">${esc(f.rival||"Rival")}</b>${(f.at||f.when)?`<span class="when">· ${esc(f.at?fxWhen(f.at):f.when)}</span>`:""}`; }
function barsHtml(entries){
  if(!entries.length) return `<div class="tiny" style="padding:8px 2px">Todavía no hay jornadas publicadas.</div>`;
  const max=Math.max(1,...entries.map(e=>e.v??0));
  return `<div class="bars">${entries.map(e=>{ const nj=e.v==null; const h=nj?4:Math.max(4,(e.v)/max*62);
    return `<div class="bar"><div class="bv">${nj?"–":e.v}</div><div class="b ${nj?"nj":""}" style="height:${h}px"></div><div class="bl">${e.l}</div></div>`; }).join("")}</div>`;
}
function openModal(html,top){

  w.innerHTML=`<div class="ov${lvl}" onclick="closeModal(${top?1:0})"></div><div class="modal${lvl}"><div class="mhandle"></div>${html}</div>`;

function closeModal(top){ const ws=[...$("mroot").children]; if(top){ const t=ws.filter(w=>w.dataset.top==="1").pop(); t&&t.remove(); } else $("mroot").innerHTML=""; }
function confirmModal(title,msg,ok,fn,danger){

function admFxWhen(tid,v){ const f=S.adm.fx.fx[tid]; const ms=v?new Date(v).getTime():0;
  if(v&&!(ms>0)) return toast("Fecha no válida",true);
  if(ms){ f.at=ms; f.when=fxWhen(ms); } else { delete f.at; f.when=""; } render(); }
function admFxToggle(tid){ const fx=S.adm.fx.fx; if(fx[tid]) delete fx[tid]; else fx[tid]={rival:"",when:"",home:true}; render(); }
async function admSaveFx(){ const J=jOpen(); const fx=S.adm.fx.fx;
  const sin=Object.keys(fx).filter(t=>!fx[t].at).map(t=>S.teams[t]?.name).filter(Boolean);
  const dl=deadlineOf({fixtures:fx});
  if(dl&&dl<=Date.now()) return toast("El primer partido ya ha empezado: revisa las fechas",true);
  await DB.batch([{op:"set",col:"jornadas",id:String(J),data:{n:J,status:"open",fixtures:fx},fields:["n","status","fixtures"]},
    {op:"set",col:"config",id:"game",data:{deadline:dl||0},merge:true}]);
  toast(sin.length?`💾 Guardado. Sin hora: ${sin.join(", ")}`:`💾 Guardado · cierra ${longWhen(dl)}`); }

function admPublish(){
  const d=S.adm.draft; const jd=curJ()||{};

  confirmModal("Publicar jornada "+d.J,`${full.length} resultados.${missing.length?`<br><br>⚠️ Sin marcador (no puntúan): ${missing.map(esc).join(", ")}.`:""}<br><br>Si te equivocas, puedes deshacerlo.`,"Publicar",async()=>{

    <div class="fl">Puntos</div>
    <div class="frow"><div class="fg"><label class="fl" for="cf_g">Ganador</label><input class="fi" id="cf_g" inputmode="numeric" value="${P.ganador}"></div>
      <div class="fg"><label class="fl" for="cf_t">Diferencia</label><input class="fi" id="cf_t" inputmode="numeric" value="${P.tramo}"></div></div>
    <div class="tiny" style="margin-bottom:10px">Los cambios de puntos se aplican a las jornadas que se publiquen a partir de ahora.</div>
    <button class="btn-p" onclick="admSaveCfg()">Guardar ajustes</button>
    ${!DEMO?`<div class="fg mt12"><label class="fl" for="cf_code">Código del club</label><div class="frow"><input class="fi" id="cf_code" placeholder="Nuevo código"><button class="btn-sm" onclick="admSetCode()">Cambiar</button></div></div>`:""}
  </div>`;
}
async function admSaveCfg(){
  const n=id=>Number($(id).value); const pts={ganador:n("cf_g"),tramo:n("cf_t")};
  if(Object.values(pts).some(v=>!(v>=0&&v<=50))) return toast("Revisa los puntos",true);
  await DB.batch([{op:"set",col:"config",id:"game",data:{season:$("cf_season").value.trim()||S.cfg.season,pts},fields:["season","pts"]}]); toast("Ajustes guardados");
}
async function admSetCode(){ const v=$("cf_code").value.trim(); if(v.length<4) return toast("Mínimo 4 caracteres",true);
  try{ await DB.setClubCode(v); toast("Código cambiado"); $("cf_code").value=""; }catch(e){ toast("Error: "+e.message,true); } }

/* ════════════════════════════════════════════════════════════════
   DATOS DE DEMO (equipos genéricos, cuentas y resultados de ejemplo)
   ════════════════════════════════════════════════════════════════ */
async function seedDemo(){
  let seed=19; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const T=[["Senior","M"],["Junior","M"],["Cadete","M"],["Cadete","F"],["Infantil","M"],["Infantil","F"],["Preinfantil","M"],["Preinfantil","F"],["Alevín","M"],["Alevín","F"]];
  const rivals=["CB Huesca","Monzón","Barbastro","Fraga","Sabiñánigo","Stadium Casablanca","CN Helios","Almozara","Tarazona","Ejea","Alcañiz","El Olivar"];
  const ops=[{op:"set",col:"config",id:"game",data:clone(DEFAULT_CFG)}]; const ids=[];
  T.forEach(([cat,g],i)=>{ const id="team"+i; ids.push({id,str:rnd()*14-4}); ops.push({op:"set",col:"teams",id,data:{cat,gender:g,suffix:"",name:`${cat} ${GENDERS[g]}`,res:{},active:true}}); });
  const nicks=["Triplista23","LaMuralla","Rebotona","Canastero7","ZonaPress","Mate_Jaca","AlleyOop","Bocina","Tapones","Contraataque","Aro_Naranja","Oroel_Fan","FamiliaLacasa","Pivot_Loco"];
  nicks.forEach((n,k)=>{ const tid= k%4===3 ? null : ids[k%ids.length].id; ops.push({op:"set",col:"managers",id:"d"+k,data:newUserDoc(n,tid)}); ops.push({op:"set",col:"preds",id:"d"+k,data:{}}); });
  await DB.batch(ops);
  for(let J=1;J<=4;J++){
    const fixtures={}; ids.forEach(x=>{ if(rnd()<0.85) fixtures[x.id]={rival:rivals[Math.floor(rnd()*rivals.length)],when:(rnd()<.5?"Sáb ":"Dom ")+(9+Math.floor(rnd()*9))+":00",home:rnd()<.5}; });
    if(J===4){ const base=new Date(); base.setDate(base.getDate()+((6-base.getDay()+7)%7||7)); base.setHours(10,0,0,0);
      Object.values(fixtures).forEach((f,i)=>{ f.at=base.getTime()+(i%2?86400e3:0)+i*3600e3; f.when=fxWhen(f.at); }); }
    await DB.batch([{op:"set",col:"jornadas",id:String(J),data:{n:J,status:"open",fixtures}}]);
    if(J===4) break; // la J4 queda abierta para probar
    const results={}; ids.forEach(x=>{ if(!fixtures[x.id]) return; let us=48+Math.round(x.str+rnd()*26), them=44+Math.round(rnd()*26); if(us===them) us++; results[x.id]={us,them}; });
    const pops=[];
    nicks.forEach((n,k)=>{ const uid="d"+k; const pj={};
      Object.keys(fixtures).forEach(tid=>{ if(S.managers[uid].teamId===tid||rnd()<.15) return; const r=results[tid]; const good=rnd()<.62;
        const w = good ? (r.us>r.them?"W":"L") : (r.us>r.them?"L":"W"); const pr={w,t:1+Math.floor(rnd()*3)};
        if(good&&rnd()<.45) pr.t=tramoOf(r.us-r.them);
        pj[tid]=pr; });
      pops.push({op:"set",col:"preds",id:uid,data:{[J]:pj},fields:[String(J)]}); });
    await DB.batch(pops);
    await DB.batch(await closeOps());
    await DB.batch(await publishOps(J,results));
  }
}

/* ════════════════════════════════════════════════════════════════
   ARRANQUE
   ════════════════════════════════════════════════════════════════ */
(async function boot(){
  if(DEMO){ startListeners(); if(DB.fresh) await seedDemo(); }
  DB.auth.onChange(u=>{
    const prev=S.user&&S.user.uid; S.user=u;
    if(!DEMO){ if(u&&u.uid!==prev) startListeners(); if(!u) stopListeners(); }
    watchMyPreds();
    if(u&&u.admin&&!DEMO) ensureConfig();
    if(u&&S.tab==="admin"&&!u.admin) S.tab="jornada";
    closeModal(); render();
  });
  if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
